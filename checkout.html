<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout — AromaClip</title>
<meta name="description" content="Checkout — AromaClip.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--black:#1a1714;--ink:#1a1714;--cream:#f4ede1;--sand:#ebe0cd;--amber:#c19a5b;--brown:#6b5d4a;
    --serif:"Newsreader",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--serif);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:26px 60px;background:var(--ink);}
  .logo{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--cream);text-decoration:none;}
  .nav-right{display:flex;align-items:center;gap:40px;}
  .nav-links{display:flex;gap:34px;}
  .nav-links a{font-family:var(--serif);font-size:15px;letter-spacing:.03em;color:var(--cream);text-decoration:none;opacity:.82;}
  .nav-links a:hover{opacity:1;}
  .cart{display:flex;color:var(--cream);opacity:.82;position:relative;}
  .cart-count{position:absolute;top:-9px;right:-11px;min-width:16px;height:16px;padding:0 4px;background:var(--amber);color:var(--black);border-radius:9px;font-family:var(--mono);font-size:10px;display:none;align-items:center;justify-content:center;}

  .co{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:70px 60px 110px;display:grid;grid-template-columns:1.15fr .85fr;gap:76px;}
  .co h1{font-family:var(--serif);font-weight:400;font-size:52px;letter-spacing:-.02em;margin-bottom:34px;}
  .breadcrumb{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--brown);margin-bottom:40px;}
  .breadcrumb a{color:var(--brown);text-decoration:none;}.breadcrumb a:hover{color:var(--black);}

  .co-sec{margin-bottom:40px;}
  .co-sec .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber);display:block;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--brown);margin-bottom:7px;text-transform:uppercase;}
  .field input,.field select{width:100%;font-family:var(--serif);font-size:16px;color:var(--black);
    background:#fbf7ef;border:1px solid rgba(107,93,74,.32);padding:14px 16px;outline:none;transition:border-color .25s;}
  .field input:focus,.field select:focus{border-color:var(--amber);}
  .field.err input{border-color:#b4502f;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .frow3{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
  .paynote{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--brown);margin-top:4px;}
  .place{width:100%;margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--cream);
    background:var(--black);border:1px solid var(--black);padding:20px;cursor:pointer;transition:background .3s,color .3s;}
  .place:hover{background:var(--amber);border-color:var(--amber);color:var(--black);}
  .backlink{display:inline-block;margin-top:22px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--brown);text-decoration:none;}
  .backlink:hover{color:var(--black);}

  .co-summary{align-self:start;background:var(--sand);padding:38px 36px;}
  .co-summary h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--brown);font-weight:400;margin-bottom:26px;}
  .s-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(107,93,74,.18);}
  .s-row svg{width:36px;height:36px;}
  .s-name{font-family:var(--serif);font-size:17px;}
  .s-name span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--brown);margin-top:4px;}
  .s-line{font-family:var(--mono);font-size:13px;}
  .s-tot{margin-top:24px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--brown);}
  .s-tot div{display:flex;justify-content:space-between;padding:7px 0;}
  .s-grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:16px;border-top:1px solid rgba(107,93,74,.28);}
  .s-grand .l{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--brown);}
  .s-grand .v{font-family:var(--serif);font-size:30px;}

  footer{background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:46px 60px;}
  footer .tagline{font-family:var(--serif);font-style:italic;font-size:20px;}
  footer .addr{font-family:var(--mono);font-size:11px;letter-spacing:.14em;opacity:.7;}

  @media (max-width:860px){
    nav{padding:20px 24px;}.nav-links{gap:20px;}.nav-links a{font-size:13px;}.nav-right{gap:22px;}
    .co{grid-template-columns:1fr;gap:44px;padding:56px 24px 80px;}
    .co-summary{order:-1;}
    footer{flex-direction:column;gap:16px;text-align:center;padding:40px 24px;}
  }
</style>
<style>.logo{display:inline-flex;align-items:center;line-height:0}.logo .logo-mark{height:32px;width:auto;display:block}</style>
<style>@media (max-width:760px){.co h1{font-size:38px;margin-bottom:26px;}}</style>
<style>.place{background:var(--amber);color:var(--black);border:1px solid var(--amber);}.place:hover{background:transparent;color:var(--amber);border-color:var(--amber);}</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 132 96" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="AromaClip"><circle cx="44" cy="48" r="34" stroke="#f4ede1" stroke-width="2.1"/><circle cx="88" cy="48" r="34" stroke="#f4ede1" stroke-width="2.1"/><path d="M66,22.08 L66,40 L59.16,30 A34,34 0 0 1 66,22.08 Z" fill="#c19a5b"/><path d="M66,22.08 A34,34 0 0 1 66,73.92 A34,34 0 0 1 66,22.08 Z" stroke="#f4ede1" stroke-width="2.1"/><path d="M66,22.08 L66,73.92" stroke="#f4ede1" stroke-width="2.1"/><path d="M66,40 L59.16,30" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/><path d="M66,40 L72.84,30" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/><path d="M66,52 L54.53,42" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/><path d="M66,52 L77.47,42" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/><path d="M66,64 L54.53,54" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/><path d="M66,64 L77.47,54" stroke="#f4ede1" stroke-width="2.1" stroke-linecap="round"/></svg></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html#collection">Shop</a>
      <a href="story.html">Story</a>
      <a href="science.html">Science</a>
      <a href="hotels.html">Hotels</a>
    </div>
    <a href="cart.html" class="cart" aria-label="Cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    </a>
  </div>
</nav>

<section class="co">
  <div class="co-form">
    <div class="breadcrumb"><a href="cart.html">Bag</a> — Checkout</div>
    <h1>Checkout</h1>

    <form id="coForm" onsubmit="return placeOrder(event)" novalidate>
      <div class="co-sec">
        <span class="eyebrow">Contact</span>
        <div class="field"><label>Email</label><input type="email" name="email" placeholder="name@email.com" required></div>
      </div>

      <div class="co-sec">
        <span class="eyebrow">Shipping address</span>
        <div class="frow">
          <div class="field"><label>First name</label><input name="fname" required></div>
          <div class="field"><label>Last name</label><input name="lname" required></div>
        </div>
        <div class="field"><label>Address</label><input name="address" placeholder="Street and number" required></div>
        <div class="field"><label>Apartment, suite (optional)</label><input name="apt"></div>
        <div class="frow3">
          <div class="field"><label>City</label><input name="city" required></div>
          <div class="field"><label>Postal code</label><input name="zip" required></div>
        </div>
        <div class="field"><label>Country</label>
          <select name="country">
            <option>Germany</option><option>Austria</option><option>France</option>
            <option>Netherlands</option><option>Poland</option><option>Ukraine</option>
            <option>Other (EU)</option>
          </select>
        </div>
      </div>

      <div class="co-sec">
        <span class="eyebrow">Payment</span>
        <div class="field"><label>Card number</label><input name="card" inputmode="numeric" placeholder="1234 5678 9012 3456" required></div>
        <div class="frow">
          <div class="field"><label>Expiry (MM/YY)</label><input name="exp" placeholder="08/28" required></div>
          <div class="field"><label>CVC</label><input name="cvc" inputmode="numeric" placeholder="123" required></div>
        </div>
        <div class="field"><label>Name on card</label><input name="cardname" required></div>
        <p class="paynote">This is a prototype — no payment is processed and no card data is stored.</p>
      </div>

      <button class="place" id="placeBtn" type="submit">Place order</button>
      <a class="backlink" href="cart.html">Return to bag</a>
    </form>
  </div>

  <aside class="co-summary">
    <h2>Order summary</h2>
    <div id="sItems"></div>
    <div class="s-tot">
      <div><span>Subtotal</span><span id="sSub">€0</span></div>
      <div><span>Shipping</span><span>Free</span></div>
    </div>
    <div class="s-grand"><span class="l">Total</span><span class="v" id="sTotal">€0</span></div>
  </aside>
</section>

<footer>
  <div class="tagline">Breathe. Feel. Live.</div>
  <div class="addr">Rhinofilt GmbH · Berlin</div>
</footer>

<script>
var K='aromaclip_cart';
function getCart(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
var ICONS={
 breathe:'<svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="24" x2="42" y2="24" stroke="#cdbfa3" stroke-width="1"/><path d="M 6.0,24.00 L 6.5,23.33 L 7.0,22.68 L 7.5,22.08 L 8.0,21.55 L 8.5,21.10 L 9.0,20.76 L 9.5,20.52 L 10.0,20.41 L 10.5,20.42 L 11.0,20.56 L 11.5,20.82 L 12.0,21.19 L 12.5,21.65 L 13.0,22.20 L 13.5,22.81 L 14.0,23.46 L 14.5,24.13 L 15.0,24.80 L 15.5,25.44 L 16.0,26.03 L 16.5,26.55 L 17.0,26.97 L 17.5,27.30 L 18.0,27.51 L 18.5,27.60 L 19.0,27.56 L 19.5,27.40 L 20.0,27.12 L 20.5,26.73 L 21.0,26.24 L 21.5,25.68 L 22.0,25.06 L 22.5,24.40 L 23.0,23.73 L 23.5,23.07 L 24.0,22.44 L 24.5,21.86 L 25.0,21.36 L 25.5,20.95 L 26.0,20.65 L 26.5,20.46 L 27.0,20.40 L 27.5,20.46 L 28.0,20.65 L 28.5,20.95 L 29.0,21.36 L 29.5,21.86 L 30.0,22.44 L 30.5,23.07 L 31.0,23.73 L 31.5,24.40 L 32.0,25.06 L 32.5,25.68 L 33.0,26.24 L 33.5,26.73 L 34.0,27.12 L 34.5,27.40 L 35.0,27.56 L 35.5,27.60 L 36.0,27.51 L 36.5,27.30 L 37.0,26.97 L 37.5,26.55 L 38.0,26.03 L 38.5,25.44 L 39.0,24.80 L 39.5,24.13 L 40.0,23.46 L 40.5,22.81 L 41.0,22.20 L 41.5,21.65 L 42.0,21.19" stroke="#c19a5b" stroke-width="2"/></svg>',
 focus:'<svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="24" x2="42" y2="24" stroke="#cdbfa3" stroke-width="1"/><path d="M 6.0,24.00 L 6.5,23.40 L 7.0,22.85 L 7.5,22.38 L 8.0,22.04 L 8.5,21.84 L 9.0,21.81 L 9.5,21.94 L 10.0,22.23 L 10.5,22.65 L 11.0,23.17 L 11.5,23.76 L 12.0,24.36 L 12.5,24.94 L 13.0,25.44 L 13.5,25.84 L 14.0,26.10 L 14.5,26.20 L 15.0,26.13 L 15.5,25.91 L 16.0,25.53 L 16.5,25.05 L 17.0,24.48 L 17.5,23.88 L 18.0,23.29 L 18.5,22.75 L 19.0,22.30 L 19.5,21.99 L 20.0,21.82 L 20.5,21.82 L 21.0,21.99 L 21.5,22.30 L 22.0,22.75 L 22.5,23.29 L 23.0,23.88 L 23.5,24.48 L 24.0,25.05 L 24.5,25.53 L 25.0,25.91 L 25.5,26.13 L 26.0,26.20 L 26.5,26.10 L 27.0,25.84 L 27.5,25.44 L 28.0,24.94 L 28.5,24.36 L 29.0,23.76 L 29.5,23.17 L 30.0,22.65 L 30.5,22.23 L 31.0,21.94 L 31.5,21.81 L 32.0,21.84 L 32.5,22.04 L 33.0,22.38 L 33.5,22.85 L 34.0,23.40 L 34.5,24.00 L 35.0,24.60 L 35.5,25.15 L 36.0,25.62 L 36.5,25.96 L 37.0,26.16 L 37.5,26.19 L 38.0,26.06 L 38.5,25.77 L 39.0,25.35 L 39.5,24.83 L 40.0,24.24 L 40.5,23.64 L 41.0,23.06 L 41.5,22.56 L 42.0,22.16" stroke="#c19a5b" stroke-width="2"/></svg>',
 sleep:'<svg viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="24" x2="42" y2="24" stroke="#cdbfa3" stroke-width="1"/><path d="M 6.0,30.06 L 6.5,30.48 L 7.0,30.80 L 7.5,31.04 L 8.0,31.17 L 8.5,31.20 L 9.0,31.13 L 9.5,30.95 L 10.0,30.68 L 10.5,30.32 L 11.0,29.86 L 11.5,29.33 L 12.0,28.71 L 12.5,28.04 L 13.0,27.30 L 13.5,26.52 L 14.0,25.70 L 14.5,24.85 L 15.0,24.00 L 15.5,23.15 L 16.0,22.30 L 16.5,21.48 L 17.0,20.70 L 17.5,19.96 L 18.0,19.29 L 18.5,18.67 L 19.0,18.14 L 19.5,17.68 L 20.0,17.32 L 20.5,17.05 L 21.0,16.87 L 21.5,16.80 L 22.0,16.83 L 22.5,16.96 L 23.0,17.20 L 23.5,17.52 L 24.0,17.94 L 24.5,18.45 L 25.0,19.03 L 25.5,19.69 L 26.0,20.40 L 26.5,21.17 L 27.0,21.97 L 27.5,22.81 L 28.0,23.66 L 28.5,24.51 L 29.0,25.36 L 29.5,26.19 L 30.0,26.99 L 30.5,27.75 L 31.0,28.45 L 31.5,29.09 L 32.0,29.66 L 32.5,30.15 L 33.0,30.55 L 33.5,30.86 L 34.0,31.07 L 34.5,31.18 L 35.0,31.19 L 35.5,31.10 L 36.0,30.91 L 36.5,30.62 L 37.0,30.24 L 37.5,29.76 L 38.0,29.21 L 38.5,28.58 L 39.0,27.89 L 39.5,27.15 L 40.0,26.35 L 40.5,25.53 L 41.0,24.68 L 41.5,23.83 L 42.0,22.98" stroke="#c19a5b" stroke-width="2"/></svg>',
 starter:'<svg viewBox="0 0 48 48" fill="none" stroke="#c19a5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8,15 Q16,9 24,15 T40,15"/><path d="M8,24 Q13,20 18,24 T28,24 T38,24"/><path d="M8,34 C13,34 15,28 21,28 C29,28 31,38 40,34"/></svg>'
};
function renderSummary(){
  var c=getCart(),el=document.getElementById('sItems'),sum=0,html='';
  if(!c.length){location.href='cart.html';return;}
  c.forEach(function(it){var line=it.price*it.qty;sum+=line;
    html+='<div class="s-row"><span>'+(ICONS[it.id]||'')+'</span>'
      +'<div class="s-name">'+it.name+'<span>Qty '+it.qty+'</span></div>'
      +'<div class="s-line">€'+line+'</div></div>';});
  el.innerHTML=html;
  document.getElementById('sSub').textContent='€'+sum;
  document.getElementById('sTotal').textContent='€'+sum;
  document.getElementById('placeBtn').textContent='Place order · €'+sum;
  var b=document.querySelector('.cart-count');if(b){var n=c.reduce(function(s,x){return s+x.qty},0);b.textContent=n;b.style.display=n>0?'flex':'none';}
}
function placeOrder(e){
  e.preventDefault();
  var f=e.target,ok=true;
  Array.prototype.forEach.call(f.querySelectorAll('input[required]'),function(i){
    var wrap=i.closest('.field');
    if(!i.value.trim()){wrap.classList.add('err');ok=false;}else{wrap.classList.remove('err');}
  });
  if(!ok){return false;}
  var c=getCart(),sum=c.reduce(function(s,x){return s+x.price*x.qty},0);
  var order={number:'AC-'+Math.floor(100000+Math.random()*900000),
    email:f.email.value.trim(),
    name:(f.fname.value+' '+f.lname.value).trim(),
    address:f.address.value.trim()+', '+f.city.value.trim()+' '+f.zip.value.trim()+', '+f.country.value,
    items:c,total:sum,date:new Date().toISOString()};
  localStorage.setItem('aromaclip_lastorder',JSON.stringify(order));
  localStorage.removeItem(K);
  location.href='confirmation.html';
  return false;
}
document.addEventListener('DOMContentLoaded',renderSummary);
</script>
</body>
</html>
